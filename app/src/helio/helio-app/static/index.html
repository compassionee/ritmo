<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Ritmo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
  <button class="chip batt" id="battChip" data-i18n-attr="aria-label:ui.app.band_battery">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><rect id="battLevel" x="9" y="9" width="6" height="10" rx="1" fill="currentColor"/></svg>
    <span id="battValue">–</span>
    <span class="band-dot" id="bandDot" hidden></span><span class="band-sync" id="bandSync" hidden></span>
  </button>
  <h1 id="title" data-i18n="tab.today"></h1>
  <button class="avatar" id="avatar" data-i18n-attr="aria-label:ui.app.profile_method" data-i18n="app.initial"></button>
</header>

<div class="pull" id="pullBox" hidden aria-live="polite"><span class="pull-spin" aria-hidden="true"></span><span id="pullText"></span></div>

<div class="daybar">
  <button class="nav" id="prev" data-i18n-attr="aria-label:ui.app.previous_day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="daytext"><b id="dayLabel" data-i18n="tab.today"></b><span id="syncLabel" data-i18n="ui.app.loading"></span></div>
  <button class="nav" id="next" data-i18n-attr="aria-label:ui.app.next_day"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<main>
  <p id="error" class="error" hidden></p>
  <p id="profileWarn" class="warn" hidden></p>

  <!-- TODAY -->
  <section id="tab-today" class="tab">
    <div class="card plan" id="planCard" hidden><span class="tag" data-i18n="ui.today.planned_today"></span><b id="planText"></b>
      <div class="advice" id="adviceBox" hidden><b id="adviceTitle"></b><p id="adviceText"></p><div class="h-src" id="adviceSrc"></div></div>
      <ul class="plan-ex" id="planEx"></ul>
      <button class="w-btn ghost" id="logStrength" hidden data-i18n="strength.log_sets"></button>
    </div>

    <div class="hero">
      <div class="hero-ring card">
        <svg id="cardioRing" viewBox="0 0 120 120" aria-hidden="true"></svg>
        <div class="hero-ring-text">
          <span class="arc-label" data-i18n="ui.today.cardio_7_days"></span>
          <b id="cardioPct">–</b>
          <span id="cardioSub">–</span>
        </div>
        <span class="badge-today" id="cardioToday" hidden></span>
      </div>
      <div class="hero-tiles">
        <button class="tile t-steps" data-go="fitness"><span class="tile-fill" id="stepsFill"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3c2 0 3 2.5 3 5s-1 4-3 4-3-1.5-3-4 1-5 3-5zm-2 11h4l-.5 3a2 2 0 0 1-3 0zM16 7c2 0 3 2.5 3 5s-1 4-3 4-3-1.5-3-4 1-5 3-5zm-2 11h4l-.5 3a2 2 0 0 1-3 0z" fill="currentColor"/></svg>
          <span class="tile-text"><small data-i18n="common.steps"></small><b id="stepsValue">–</b></span></button>
        <button class="tile t-ready" data-go="health">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2" fill="currentColor"/><path d="M9 21l3-7 3 3v5M7 12l3-4 4 2 3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="tile-text"><small data-i18n="common.readiness"></small><b id="readyValue">–</b></span></button>
        <button class="tile t-sleep" data-go="sleep"><span class="tile-fill" id="sleepFill"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
          <span class="tile-text"><small id="sleepTileLbl" data-i18n="tab.sleep"></small><b id="sleepValue">–</b></span></button>
      </div>
    </div>

    <div id="insights" class="list"></div>

    <div class="card week" id="weekCard" hidden>
      <div class="row"><span class="tag t-week" data-i18n="ui.today.week"></span>
        <div class="seg-switch"><button id="weekCur" class="on" data-i18n="ui.today.current"></button><button id="weekPrev" data-i18n="ui.today.last"></button></div></div>
      <h3 id="weekTitle">–</h3>
      <div class="week-days" id="weekDays"></div>
      <div class="week-stats" id="weekStats"></div>
      <div class="h-src" id="weekSrc"></div>
    </div>

    <h2 class="section" data-i18n="ui.today.day"></h2>
    <div class="grid2">
      <div class="card stat"><span class="tag t-kcal" data-i18n="ui.today.calories"></span><b id="kcalTotal">–</b><small id="kcalRange" data-i18n="ui.today.total_kcal_estimate"></small>
        <div class="stack"><i class="seg bmr" id="kcalBmrSeg"></i><i class="seg act" id="kcalActSeg"></i></div>
        <small><span class="dot bmr"></span><span data-i18n="ui.today.basal"></span> <b id="kcalBmr">–</b></small><small><span class="dot act"></span><span data-i18n="ui.today.active"></span> <b id="kcalActive">–</b></small></div>
      <div class="card stat"><span class="tag t-active" data-i18n="ui.today.active_minutes"></span><b id="activeValue">–</b><small id="activeSub">–</small>
        <div class="bar"><i id="activeFill"></i></div><small id="distValue">–</small></div>
    </div>
    <div class="card stat wide">
      <div class="row"><span class="tag t-hr" data-i18n="common.hr"></span><small id="hrLastTime"></small></div>
      <div class="row big"><b id="hrLast">–</b><span class="unit" data-i18n="ui.today.bpm"></span>
        <span class="side"><span><span data-i18n="ui.today.resting"></span> <b id="hrResting">–</b></span><span><span data-i18n="ui.today.minmax"></span> <b id="hrRange">–</b></span></span></div>
      <div id="hrSpark" class="spark"></div>
    </div>
    <div class="grid2">
      <div class="card stat"><span class="tag t-stress" data-i18n="ui.today.average_stress"></span><b id="stressValue">–</b><small id="stressSub">–</small></div>
      <div class="card stat"><span class="tag t-spo2" data-i18n="ui.today.average_spo2"></span><b id="spo2Value">–</b><small id="spo2Sub">–</small></div>
    </div>
  </section>

  <!-- FITNESS -->
  <section id="tab-fitness" class="tab" hidden>
    <div class="row head"><h2 class="section" data-i18n="common.trainings"></h2><small id="workoutSummary"></small></div>
    <button class="add-btn" id="addActivity"><span>+</span> <span data-i18n="ui.fitness.add_activity"></span></button>
    <div id="workoutList" class="list"></div>

    <h2 class="section" data-i18n="ui.fitness.key_metrics"></h2>
    <div class="card">
      <div class="row"><span class="tag t-kcal" data-i18n="ui.fitness.energy_burned"></span><small data-i18n="common.estimate"></small></div>
      <div class="row big"><b id="fitKcal">–</b><span class="unit" data-i18n="ui.fitness.kcal_today"></span></div>
      <div id="weekKcal" class="chart"></div>
    </div>
    <div class="card" id="strengthCard">
      <div class="row"><span class="tag t-strength" data-i18n="common.strength"></span><small id="strengthWeek"></small></div>
      <div id="strengthList" class="str-list"></div>
      <button class="w-btn ghost" id="strengthOpen" data-i18n="strength.log_sets"></button>
      <div class="h-src" id="strengthSrc"></div>
    </div>
    <div class="card" id="vo2Card">
      <div class="row"><span class="tag t-vo2" data-i18n="ui.fitness.estimated_vo2max"></span><small data-i18n="ui.fitness.ml_kg_min"></small></div>
      <div class="row big"><b id="vo2Value">–</b><span class="unit" id="vo2Range"></span></div>
      <div id="vo2Chart" class="chart"></div>
      <p class="muted" id="vo2Alt"></p>
      <p class="note" id="vo2Text"></p>
      <div class="h-src" id="vo2Src"></div>
    </div>
    <div class="card">
      <div class="row"><span class="tag t-load" data-i18n="ui.fitness.load"></span><small data-i18n="ui.fitness.banister_trimp_28_days"></small></div>
      <div class="row big"><b id="loadToday">–</b><span class="unit" data-i18n="common.today_lc"></span>
        <span class="side"><span><span data-i18n="common.last_7_days"></span> <b id="loadWeek">–</b></span><span id="loadAvg">–</span></span></div>
      <div id="loadChart" class="chart"></div>
      <p class="note" id="loadNote"></p>
      <div id="loadSrc"></div>
    </div>
    <div class="card">
      <div class="row"><span class="tag t-pai" data-i18n="ui.fitness.pai"></span><span class="zepp" id="paiTag" data-i18n="ui.fitness.licensed_algorithm"></span></div>
      <div class="row big"><b id="paiWeek">–</b><span class="unit" data-i18n="common.7_days"></span><span class="side"><span><span data-i18n="common.today_lc"></span> <b id="paiToday">–</b></span></span></div>
      <div class="bar pai"><i id="paiFill"></i></div>
      <div class="legend" id="paiLegend"></div>
      <p class="note" id="paiNote"></p>
      <div class="h-src" id="paiSrc"></div>
    </div>
    <div class="card">
      <div class="row"><span class="tag t-zone" data-i18n="ui.fitness.zone_minutes"></span><small data-i18n="common.last_7_days"></small></div>
      <div class="row big"><b id="zoneWeek">–</b><span class="unit" id="zoneWeekUnit" data-i18n="ui.fitness.150_min_who"></span></div>
      <div class="bar zone"><i id="zoneWeekFill"></i></div>
      <h4 class="sub" data-i18n="ui.fitness.today_zones"></h4>
      <div id="zoneBars" class="zone-bars"></div>
      <small id="hrmaxLabel" class="note"></small>
      <div id="hrmaxSrc"></div>
    </div>
    <div class="card">
      <div class="row"><span class="tag t-steps" data-i18n="common.steps"></span><small data-i18n="common.7_days"></small></div>
      <div id="weekSteps" class="chart"></div>
      <small id="weekStepsSub" class="note"></small>
    </div>
  </section>

  <!-- SLEEP -->
  <section id="tab-sleep" class="tab" hidden>
    <div class="card sleep-card">
      <div class="row"><span class="tag t-sleep" data-i18n="ui.sleep.last_night"></span><span class="pill score" id="sleepScore" hidden></span></div>
      <h3 id="sleepTitle">–</h3>
      <p id="sleepText" class="muted"></p>
      <div class="stage-chart" id="stageChart"></div>
      <div class="row meta"><small><span data-i18n="ui.sleep.bed"></span> <b id="sleepBed">–</b></small><small id="sleepNapWrap" hidden><span data-i18n="ui.sleep.naps"></span> <b id="sleepNaps">–</b></small><small><span data-i18n="ui.sleep.source"></span> <b id="sleepSource">–</b></small></div>
    </div>

    <p class="note zepp-note" id="sleepScoreNote" hidden></p>

    <div class="card">
      <h3 class="card-title" id="hlTitle" data-i18n="ui.sleep.key_points"></h3>
      <div id="sleepHighlights" class="highlights"></div>
    </div>

    <div class="card" id="sriCard">
      <div class="row"><span class="tag t-sleep" data-i18n="ui.sleep.sleep_regularity"></span><small data-i18n="ui.sleep.last_14_days"></small></div>
      <div class="row big"><b id="sriValue">–</b><span class="unit" id="sriUnit"></span></div>
      <div class="row meta"><small><span data-i18n="ui.sleep.fall_asleep"></span> <b id="sriOnset">–</b></small><small><span data-i18n="ui.sleep.wake_up"></span> <b id="sriWake">–</b></small></div>
      <p class="note" id="sriText"></p>
      <div class="h-src" id="sriSrc"></div>
    </div>

    <h2 class="section" data-i18n="ui.sleep.during_sleep"></h2>
    <div class="grid2 vit">
      <div class="card stat"><span class="tag t-hr" data-i18n="common.hr"></span><b id="sleepHr">–</b><small id="sleepHrSub" data-i18n="ui.sleep.average_bpm"></small></div>
      <div class="card stat"><span class="tag t-hrv" data-i18n="ui.sleep.hrv"></span><b id="hrvValue">–</b><small id="hrvSub" data-i18n="ui.sleep.ms"></small></div>
      <div class="card stat"><span class="tag t-spo2" data-i18n="ui.sleep.breathing"></span><b id="respValue">–</b><small data-i18n="ui.sleep.breaths_per_minute"></small></div>
      <div class="card stat"><span class="tag t-spo2" data-i18n="ui.sleep.spo2"></span><b id="sleepSpo2">–</b><small id="sleepSpo2Sub">–</small></div>
      <div class="card stat"><span class="tag t-kcal" data-i18n="ui.sleep.wrist_temp"></span><b id="sleepTemp">–</b><small data-i18n="ui.sleep.night_average"></small></div>
    </div>

    <div class="card">
      <div class="row"><span class="tag t-sleep" data-i18n="tab.sleep"></span><small data-i18n="common.7_days"></small></div>
      <div id="sleepWeek" class="chart"></div>
    </div>
    <p class="note" data-i18n="ui.sleep.stages_times_score_are"></p>
  </section>

  <!-- HEALTH -->
  <section id="tab-health" class="tab" hidden>
    <div class="card vitals-card">
      <span class="tag t-vital"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l2-5 4 10 2-5h8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="ui.health.vital_signs"></span></span>
      <h3 id="vitTitle">–</h3>
      <p id="vitText" class="muted"></p>
      <div class="vit-box">
        <div class="row"><span id="vitName">–</span><span class="pill" id="vitPill" hidden></span></div>
        <div class="row big"><b id="vitValue">–</b><span class="unit" id="vitUnit"></span></div>
        <div id="vitChart" class="chart"></div>
      </div>
      <div class="chips" id="vitChips"></div>
    </div>

    <div class="card" id="readyCard">
      <div class="row"><span class="tag t-ready" data-i18n="common.readiness"></span><small data-i18n="common.estimate"></small></div>
      <div class="row big"><b id="readyScore">–</b><span class="unit" id="readyLabel"></span></div>
      <ul class="parts" id="readyParts"></ul>
    </div>

    <h2 class="section" data-i18n="ui.health.how_you_are_doing"></h2>
    <div class="card"><div id="healthSummary" class="health-summary"></div>
      <p class="note" data-i18n="ui.health.ratings_compare_values_thresholds"></p></div>
    <div id="healthItems" class="list"></div>

    <div class="card" id="stressCard">
      <div class="row"><span class="tag t-stress" data-i18n="ui.health.stress_during_day"></span><span class="zepp" data-i18n="ui.health.zepp_algorithm"></span></div>
      <small id="stressAvgLbl"></small>
      <div id="stressChart" class="chart"></div>
      <div class="stack" id="stressBar"></div>
      <div class="legend" id="stressLegend"></div>
      <p class="note" id="stressNote"></p>
      <div class="h-src" id="stressSrc"></div>
    </div>
  </section>

  <!-- FOOD -->
  <section id="tab-food" class="tab" hidden>
    <p id="nutError" class="error" hidden></p>
    <div class="card nut-hero" id="nutHero">
      <div class="row"><span class="tag t-food" id="nutTag" data-i18n="ui.food.balance"></span>
        <div class="seg-switch" id="goalSwitch"><button data-goal="lose_fat" data-i18n="ui.food.lose_fat"></button><button data-goal="maintain" data-i18n="ui.food.maintain"></button></div></div>
      <div class="row big"><b id="nutKcal">–</b><span class="unit" data-i18n="ui.food.kcal"></span>
        <span class="side"><span><span data-i18n="ui.food.expenditure"></span> <b id="nutExp">–</b></span><span><span data-i18n="ui.food.balance_2"></span> <b id="nutBal">–</b></span></span></div>
      <small id="nutRange"></small>
      <div class="bal-bar" id="nutBar"><i id="nutBarIn"></i><span id="nutBarExp"></span></div>
      <div class="stack macro" id="nutSplit"></div>
      <div class="legend" id="nutSplitLegend"></div>
      <button class="w-btn ghost" id="nutComplete" data-i18n="ui.food.mark_day_as_complete"></button>
      <p class="note" id="nutCompleteNote"></p>
    </div>

    <div id="nutMeals" class="list"></div>

    <div class="card" id="nutDayCard">
      <div class="row"><span class="tag t-food" data-i18n="ui.food.nutrients_day"></span><small id="nutDaySub"></small></div>
      <div id="nutDayChecks" class="checks"></div>
    </div>

    <div class="card" id="nutWeekCard">
      <div class="row"><span class="tag t-food" data-i18n="ui.food.last_7_days"></span><small id="nutWeekSub"></small></div>
      <h3 id="nutWeekTitle">–</h3>
      <div id="nutWeekChart" class="chart"></div>
      <div class="legend" id="nutWeekLegend"></div>
      <div id="nutWeekChecks" class="checks"></div>
    </div>

    <div class="card" id="nutRecoveryCard" hidden>
      <span class="tag t-run" data-i18n="ui.food.recovery_between_two_workouts"></span>
      <ul id="nutRecoveryPairs" class="parts"></ul>
      <p class="note" id="nutRecoveryText"></p>
      <div class="h-src" id="nutRecoverySrc"></div>
    </div>

    <div class="card" id="nutWeightCard">
      <div class="row"><span class="tag t-food" data-i18n="ui.food.check_against_weight"></span><span class="pill" id="nutWeightPill" hidden></span></div>
      <p id="nutWeightText" class="muted"></p>
      <div class="h-src" id="nutWeightSrc"></div>
    </div>

    <div class="card" id="nutAthleteCard">
      <div class="row"><span class="tag t-info" data-i18n="ui.food.carbohydrates_athletes"></span><span class="coi warn" data-i18n="ui.food.flagged_reference"></span></div>
      <div class="row big"><b id="nutAthleteValue">–</b><span class="unit" id="nutAthleteUnit"></span></div>
      <p class="note" id="nutAthleteText"></p>
      <div class="h-src" id="nutAthleteSrc"></div>
    </div>

    <div class="card" id="foodsCard">
      <div class="row"><h3 class="card-title" data-i18n="ui.food.foods_2"></h3><small id="foodsCount"></small></div>
      <div class="seg-switch wide" id="foodsSwitch"><button data-k="food" class="on" data-i18n="ui.food.foods"></button><button data-k="recipe" data-i18n="ui.food.recipes"></button><button data-k="pasto" data-i18n="ui.food.saved_meals"></button></div>
      <input class="search" id="foodsSearch" type="search" autocomplete="off" data-i18n-attr="placeholder:common.search;aria-label:ui.food.search_foods">
      <div id="foodsList" class="food-list"></div>
      <div class="export-btns"><button class="add-btn small" id="newFood"><span>+</span> <span data-i18n="ui.food.food"></span></button><button class="add-btn small" id="newRecipe"><span>+</span> <span data-i18n="ui.food.recipe"></span></button><button class="add-btn small" id="newMeal"><span>+</span> <span data-i18n="ui.food.saved_meal"></span></button></div>
      <p class="note" id="nutMethod"></p>
      <div class="h-src" id="nutMethodSrc"></div>
    </div>
  </section>

  <!-- PROFILE (from the avatar) -->
  <section id="tab-profile" class="tab" hidden>
    <div class="card" id="langCard">
      <label class="sheet-row"><span data-i18n="lang.label"></span><select id="langSel">
        <option value="" data-i18n="lang.system"></option><option value="it" data-i18n="lang.name.it"></option><option value="en" data-i18n="lang.name.en"></option></select></label>
      <small class="muted" data-i18n="lang.note"></small>
    </div>
    <div class="card">
      <div class="row"><h3 class="card-title" data-i18n="ui.profile.profile_used_calculations"></h3><button class="w-btn ghost" id="profOpen" data-i18n="common.edit"></button></div>
      <p class="muted" id="profileText"></p>
      <p class="note" data-i18n="ui.profile.calories_basal_metabolic_rate"></p>
      <div class="h-src" id="kcalSrc"></div>
    </div>
    <div class="card" id="weightCard">
      <div class="row"><h3 class="card-title" data-i18n="ui.profile.weight"></h3><button class="w-btn ghost" id="weightOpen" data-i18n="ui.profile.update"></button></div>
      <div class="row big"><b id="weightValue">–</b><span class="unit" data-i18n="ui.profile.kg"></span><small id="weightSrc"></small></div>
      <p class="note" data-i18n="ui.profile.from_day_you_enter"></p>
    </div>
    <div class="card" id="planEditCard">
      <div class="row"><h3 class="card-title" data-i18n="plan.title"></h3><button class="w-btn ghost" id="planOpen" data-i18n="common.edit"></button></div>
      <p class="muted" id="planEmpty" hidden data-i18n="plan.empty"></p>
      <ul class="plan-week" id="planWeek"></ul>
      <small class="note" id="planSource"></small>
    </div>
    <div class="card" id="catalogCard">
      <h3 class="card-title" data-i18n="cat.title"></h3>
      <p class="muted" data-i18n="cat.intro"></p>
      <ul class="cat-list" id="catalogList"></ul>
      <div class="export-btns"><button class="w-btn ghost" id="catalogImport" data-i18n="cat.import_file"></button><button class="w-btn ghost" id="catalogRemove" data-i18n="cat.remove_off"></button></div>
      <p class="note" id="catalogStatus" hidden></p>
      <p class="note" id="catalogServerNote" hidden></p>
      <div class="row"><button class="w-btn ghost" id="catalogBench" data-i18n="cat.bench"></button><small id="catalogBenchOut"></small></div>
      <p class="error" id="catalogErr" hidden></p>
      <button class="w-btn ghost" id="catalogAbout" data-i18n="about.sources_licences"></button>
    </div>
    <div class="card" id="exportCard">
      <h3 class="card-title" data-i18n="ui.profile.export_data"></h3>
      <label class="sheet-row"><span data-i18n="ui.profile.period"></span><select id="exportRange">
        <option value="30" data-i18n="ui.profile.last_30_days"></option><option value="90" data-i18n="ui.profile.last_90_days"></option>
        <option value="365" data-i18n="ui.profile.last_year"></option><option value="730" data-i18n="ui.profile.last_2_years"></option></select></label>
      <label class="sheet-row"><span data-i18n="ui.profile.format"></span><select id="exportFmt">
